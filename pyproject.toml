[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duque"
version = "0.1.0"
description = "Duque - assistente pessoal local"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "openai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
exclude = [".venv", "lixeira"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["tests"]
exclude = [".venv", "lixeira"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "none"
