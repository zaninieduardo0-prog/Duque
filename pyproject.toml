[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duque"
version = "0.1.0"
description = "Duque - assistente pessoal local"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "openai>=1.0",
    "openai-agents>=0.6",
    "numpy>=2.2",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "pvrecorder>=1.2",
    "pedalboard>=0.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]

[tool.setuptools]
# Scripts de entrada na raiz do projeto (não são pacotes).
py-modules = ["duque", "duque_supervisor", "duque_wake", "servidor"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "automation*",
    "agent*",
    "brain*",
    "computer*",
    "core*",
    "forge*",
    "memory*",
    "voice*",
]
exclude = ["interface*", "tests*", "lixeira*", ".venv*"]
namespaces = true

[tool.ruff]
line-length = 100
exclude = [".venv", "lixeira"]

[tool.ruff.lint]
# Mesmo conjunto usado pela Forja (forge/quality.py) e pelo CI.
select = ["E", "F"]
ignore = ["E501"]

[tool.pyright]
include = [
    "automation",
    "agent",
    "brain",
    "computer",
    "core",
    "forge",
    "memory",
    "voice",
    "duque.py",
    "duque_supervisor.py",
    "servidor.py",
    "duque_wake.py",
]
exclude = [".venv", "lixeira"]
# Versão mínima suportada (requires-python): o CI checa o que precisa rodar nela.
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
