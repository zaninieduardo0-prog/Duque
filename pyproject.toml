[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duque"
version = "0.1.0"
description = "Duque - assistente pessoal local"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "openai>=1.0",
    "openai-agents>=0.6",
    "numpy>=2.2",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "pvrecorder>=1.2",
    "pedalboard>=0.9",
    "anthropic>=1.11",
    "playwright>=1.45",
    "pillow>=10",
    "vosk>=0.3.45",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "automation*",
    "agent*",
    "brain*",
    "computer*",
    "core*",
    "forge*",
    "memory*",
    "voice*",
    "telex*",
]
exclude = ["interface*", "tests*", "lixeira*", ".venv*"]
namespaces = true

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "lixeira", "duque_data", "interface"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = [
    "automation",
    "agent",
    "brain",
    "computer",
    "core",
    "forge",
    "memory",
    "voice",
    "telex",
    "duque.py",
    "duque_supervisor.py",
    "diagnostico.py",
    "servidor.py",
    "duque_wake_v2.py",
]
exclude = [".venv", "lixeira", "duque_data"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "none"
