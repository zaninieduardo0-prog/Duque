name: Duque Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip pytest pytest-github-actions-annotate-failures ruff pyright
          python -m pip install -e .
      - name: Import runtime modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import servidor; import duque_wake_v3"
      - name: Compile Python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q .
      - name: Run Ruff
        run: ruff check automation brain computer core memory voice agent tests servidor.py duque.py duque_wake_v2.py duque_wake_v3.py --select E,F --ignore E501
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests
      - name: Run Pyright
        run: pyright
