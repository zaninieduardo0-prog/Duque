name: Duque Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install quality tools
        run: python -m pip install --upgrade pip pytest ruff pyright

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: ruff check tests

      - name: Run Pyright
        run: pyright
