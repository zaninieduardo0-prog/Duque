name: Duque Quality Gate

# Workflow único (o antigo ci.yml repetia um pedaço deste e gerava checks em dobro
# para a Forja esperar). Os mesmos passos rodam na verificação local da Forja.
on:
  push:
    branches: ["main", "duque/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  checks: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip pytest pytest-github-actions-annotate-failures ruff pyright
          python -m pip install -e .
      - name: Import runtime modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import servidor; import duque_wake_v2"
      - name: Compile Python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q .
      - name: Run Ruff
        run: ruff check . --select E,F --ignore E501
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Run Pyright
        run: python .github/scripts/pyright_annotate.py
