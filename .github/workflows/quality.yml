name: Duque Quality Gate

on:
  push:
    branches: ["main", "duque/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip pytest-github-actions-annotate-failures
          python -m pip install -e ".[dev]"
      - name: Import runtime modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import servidor; import duque_wake"
      - name: Compile Python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q .
      - name: Run Ruff
        run: ruff check .
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests
      - name: Run Pyright
        run: python .github/scripts/pyright_annotate.py
