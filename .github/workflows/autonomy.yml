name: Autonomy Updates

on:
  workflow_dispatch:
    inputs:
      run_updates:
        description: 'Run automated repository updates and open PR'
        required: true
        default: 'true'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip

      - name: Run updates script
        if: ${{ github.event.inputs.run_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/auto_update.py
